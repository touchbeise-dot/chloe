<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#FCFAF4">
<script>/* needs a trailing slash so the icon, manifest and offline cache resolve under the secret path */
if(/^https?:/.test(location.protocol)&&location.pathname.length>1&&!location.pathname.endsWith('/'))location.replace(location.pathname+'/'+location.search+location.hash);</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chloe's EA">
<link rel="apple-touch-startup-image" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1320x2868.png">
<title>Chloe's EA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FFF4C7; --blue:#CFE8F6; --brown:#6B5143;
  --off:#FCFAF4; --cream:#F7F1E7; --blue2:#EEF7FB; --yellow2:#FFF9E6; --muted:#9A8375;
  --line:rgba(107,81,67,.10); --line2:rgba(107,81,67,.18);
  --glass:rgba(255,255,255,.55);
  --r-lg:26px; --r-md:20px; --r-sm:14px;
  --shadow:0 10px 30px -14px rgba(107,81,67,.28);
  --font:'Instrument Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
  --nav-h:72px;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  font-family:var(--font); color:var(--brown); background:var(--off);
  -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.45;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brown);outline-offset:2px;border-radius:8px}
::selection{background:var(--yellow)}

/* frame: full-bleed on phone, centered phone column on larger screens */
#app{position:relative;min-height:100%;max-width:470px;margin:0 auto;background:var(--off);
  padding-top:env(safe-area-inset-top,0px);}
@media(min-width:720px){
  body{background:linear-gradient(160deg,#FFF9E6 0%,#F7F1E7 45%,#EEF7FB 100%);background-attachment:fixed}
  #app{min-height:100dvh;box-shadow:0 30px 80px -30px rgba(107,81,67,.35)}
}
/* ambient blobs */
.ambient{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.ambient i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75}
.ambient i:nth-child(1){width:320px;height:320px;background:var(--yellow);top:-120px;left:-90px}
.ambient i:nth-child(2){width:300px;height:300px;background:var(--blue);top:60px;right:-140px;opacity:.6}
.ambient i:nth-child(3){width:260px;height:260px;background:var(--yellow2);top:520px;left:-60px;opacity:.9}

.screen{display:none;position:relative;z-index:1;padding:14px 20px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 110px)}
.screen.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:0s!important;transition-duration:0s!important}}

h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.15}
h2{font-size:21px}
h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sec-h h2{font-size:17px}
.sec-h button{color:var(--muted);font-size:13px}

/* cards */
.card{background:#fff;border-radius:var(--r-md);padding:16px 18px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.7)}
.card.cream{background:var(--cream);box-shadow:none;border-color:transparent}
.card.glass{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.65)}
.card.grad{background:linear-gradient(135deg,var(--yellow),var(--cream) 55%,var(--blue));box-shadow:none;border-color:rgba(255,255,255,.6)}
.card.blue{background:var(--blue2);box-shadow:none;border-color:transparent}
.card.yellow{background:var(--yellow2);box-shadow:none;border-color:transparent}
.card + .card{margin-top:10px}

.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin:0 -20px;padding-left:20px;padding-right:20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:38px;padding:0 15px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.chip.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.chip .n{font-size:12px;opacity:.7}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;background:var(--brown);color:#fff;font-weight:600;font-size:15px;transition:transform .12s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--cream);color:var(--brown)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.btn.danger{background:#fff;color:#A5473A;box-shadow:inset 0 0 0 1px rgba(165,71,58,.25)}

/* pills / badges */
.tag{display:inline-flex;flex-shrink:0;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--cream);color:var(--muted)}
.tag.urgent{background:#F9E3DC;color:#A5473A}
.tag.important{background:var(--yellow);color:var(--brown)}
.tag.upcoming{background:var(--blue2);color:#4F6E82}

/* HOME */
.greet{margin-top:10px}
.greet .date{margin-top:6px;display:flex;align-items:baseline;gap:10px}
.greet .clock{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.summary{margin-top:20px;padding:22px 20px;border-radius:var(--r-lg);background:linear-gradient(135deg,var(--yellow) 0%,var(--cream) 50%,var(--blue) 100%);border:1px solid rgba(255,255,255,.7);box-shadow:0 20px 40px -24px rgba(107,81,67,.35)}
.summary h2{font-size:21px;line-height:1.25;margin-bottom:8px}
.summary p{font-size:15px;line-height:1.5}
.glance{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.glance span{font-size:13px;color:var(--muted);background:rgba(255,255,255,.55);padding:4px 11px;border-radius:999px}
.upnext .item{display:flex;gap:14px;padding:11px 0;border-top:1px solid var(--line)}
.upnext .item:first-child{border-top:0;padding-top:0}
.upnext .item:last-child{padding-bottom:0}
.upnext time{width:72px;flex:0 0 72px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;padding-top:1px}
.upnext .t{font-weight:500}
.wk .item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.wk .item:first-child{border-top:0;padding-top:0}.wk .item:last-child{padding-bottom:0}
.wk .dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:0 0 9px}
.dot.urgent{background:#C9654F}.dot.important{background:#E9C85C}.dot.upcoming{background:#8FBBD6}
.ask{margin-top:28px;display:flex;align-items:center;gap:12px;width:100%;padding:16px 18px;border-radius:999px;background:linear-gradient(120deg,rgba(255,255,255,.7),rgba(255,255,255,.4));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow);text-align:left;font-size:16px;font-weight:500}
.ask .star{width:34px;height:34px;border-radius:50%;background:var(--brown);color:#FFF4C7;display:grid;place-items:center;font-size:16px;flex:0 0 34px}
.wrap{margin-top:20px}

/* TASKS */
.task{display:flex;align-items:center;gap:14px;background:#fff;border-radius:var(--r-sm);padding:13px 14px;position:relative;overflow:hidden;box-shadow:0 6px 16px -12px rgba(107,81,67,.3);touch-action:pan-y;transition:transform .2s}
.task + .task{margin-top:8px}
.task .cb{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);flex:0 0 26px;display:grid;place-items:center;transition:background .15s,border-color .15s;background:#fff}
.task.done .cb{background:var(--brown);border-color:var(--brown);color:#fff}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px}
.task .meta .late{color:#A5473A}
.task .pr{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.pr.high{background:#C9654F}.pr.med{background:#E9C85C}.pr.low{background:#B8D3E2}
.swipe-wrap{position:relative;border-radius:var(--r-sm)}
.swipe-wrap + .swipe-wrap{margin-top:8px}
.swipe-bg{position:absolute;inset:0;border-radius:var(--r-sm);background:var(--yellow);display:flex;align-items:center;padding-left:18px;color:var(--brown);font-weight:600;font-size:14px}
.swipe-wrap .task{margin:0}
.empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:15px}
.empty b{display:block;color:var(--brown);font-weight:600;font-size:17px;margin-bottom:4px}
.inbox-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--cream);border-radius:var(--r-sm)}
.inbox-item + .inbox-item{margin-top:8px}
.inbox-item .t{flex:1}
.inbox-item .sort{height:32px;padding:0 12px;border-radius:999px;background:#fff;font-size:13px;font-weight:500}
.capture{display:flex;gap:8px;margin-top:10px}
.capture input{flex:1;height:48px;border-radius:999px;border:1px solid var(--line);background:#fff;padding:0 18px;font-size:15px}
.capture input::placeholder{color:var(--muted)}
.capture button{width:48px;height:48px;border-radius:50%;background:var(--brown);color:#fff;font-size:22px;flex:0 0 48px}

/* CALENDAR */
.agenda-day{margin-top:18px}
.agenda-day h3{font-size:15px;color:var(--muted);font-weight:500;margin-bottom:8px}
.agenda-day h3 b{color:var(--brown);font-weight:600}
.ev{display:flex;gap:14px;background:#fff;border-radius:var(--r-sm);padding:12px 14px;box-shadow:0 6px 16px -12px rgba(107,81,67,.3);border-left:4px solid var(--blue)}
.ev + .ev{margin-top:8px}
.ev time{width:70px;flex:0 0 70px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.ev .t{font-weight:500}.ev .loc{font-size:12px;color:var(--muted);margin-top:2px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.month .dow{text-align:center;font-size:11px;color:var(--muted);padding:6px 0}
.month .d{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;position:relative;background:transparent}
.month .d.other{color:rgba(154,131,117,.45)}
.month .d.today{background:var(--yellow);font-weight:600}
.month .d.sel{box-shadow:inset 0 0 0 2px var(--brown)}
.month .d i{width:5px;height:5px;border-radius:50%;background:#8FBBD6;margin-top:3px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.week .wd{text-align:center;border-radius:14px;padding:8px 0;background:#fff;font-size:13px}
.week .wd.today{background:var(--yellow)}
.week .wd b{display:block;font-size:17px;font-weight:600}
.week .wd em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:2px}
.week .wd.sel{box-shadow:inset 0 0 0 2px var(--brown)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.cal-nav button{width:36px;height:36px;border-radius:50%;background:#fff;font-size:18px;color:var(--muted)}

/* LIFE hub */
.hub{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.hub button{text-align:left;padding:18px 16px 16px;border-radius:var(--r-md);min-height:122px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .12s}
.hub button:active{transform:scale(.97)}
.hub .ic{font-size:24px;line-height:1}
.hub b{display:block;font-size:16px;font-weight:600;margin-top:10px}
.hub span{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.hub .fin{background:linear-gradient(135deg,var(--yellow),var(--yellow2))}
.hub .trv{background:linear-gradient(135deg,var(--blue),var(--blue2))}
.hub .shp{background:#fff;box-shadow:var(--shadow)}
.hub .hom{background:var(--cream)}
.hub .pet{background:linear-gradient(135deg,var(--yellow2),var(--blue2))}
.hub .wsh{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.7)}
.hub .nts{background:#fff;box-shadow:var(--shadow);grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;gap:14px}
.hub .nts b{margin-top:0}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;height:36px;margin-bottom:6px}

/* subpage items */
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}.li:last-child{padding-bottom:0}
.li .t{font-weight:500}.li .s{font-size:12px;color:var(--muted);margin-top:2px}
.li .amt{font-variant-numeric:tabular-nums;font-weight:500}
.li .ic{width:38px;height:38px;border-radius:12px;background:var(--cream);display:grid;place-items:center;font-size:17px;flex:0 0 38px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .card{padding:14px 16px}
.stat .lbl{font-size:12px;color:var(--muted)}
.stat .val{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.bar{height:8px;border-radius:999px;background:rgba(107,81,67,.1);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--yellow),var(--blue))}
.cat-bars .r{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.cat-bars .r .n{width:96px;flex:0 0 96px}
.cat-bars .r .b{flex:1;height:8px;border-radius:999px;background:rgba(107,81,67,.08)}
.cat-bars .r .b i{display:block;height:100%;border-radius:999px;background:var(--brown);opacity:.7}
.cat-bars .r .v{width:70px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}

/* trip */
.trip-card{display:block;width:100%;text-align:left;padding:18px;border-radius:var(--r-lg);background:linear-gradient(135deg,var(--blue),var(--blue2) 60%,#fff);border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow)}
.trip-card + .trip-card{margin-top:10px}
.trip-card .flag{font-size:28px}
.trip-card h3{font-size:22px;margin-top:6px;letter-spacing:.02em;text-transform:uppercase}
.trip-card .cd{display:inline-block;margin-top:10px;background:rgba(255,255,255,.7);padding:4px 11px;border-radius:999px;font-size:13px;font-weight:500}
.trip-hero{padding:26px 20px 22px;border-radius:var(--r-lg);background:linear-gradient(145deg,var(--blue) 0%,var(--cream) 60%,var(--yellow) 100%);text-align:center;border:1px solid rgba(255,255,255,.7)}
.trip-hero .flag{font-size:44px}
.trip-hero h1{font-size:34px;letter-spacing:.04em;text-transform:uppercase;margin-top:6px}
.trip-hero .dates{margin-top:4px;color:var(--muted)}
.trip-hero .cd{margin-top:12px;display:inline-block;background:#fff;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px}
.tsec{margin-top:14px}
.tsec summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow);font-weight:600;cursor:pointer}
.tsec summary::-webkit-details-marker{display:none}
.tsec summary .cnt{font-size:12px;color:var(--muted);font-weight:500}
.tsec[open] summary{border-radius:var(--r-md) var(--r-md) 0 0}
.tsec .body{background:#fff;border-radius:0 0 var(--r-md) var(--r-md);padding:4px 18px 16px;box-shadow:var(--shadow)}
.pack{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px}
.pack .cb{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:12px;flex:0 0 22px;background:#fff}
.pack.done .cb{background:var(--brown);color:#fff;border-color:var(--brown)}
.pack.done span{color:var(--muted);text-decoration:line-through}
.addline{display:flex;gap:8px;margin-top:10px}
.addline input{flex:1;height:40px;border-radius:999px;border:1px solid var(--line);padding:0 14px;background:var(--off);font-size:14px}
.addline button{height:40px;padding:0 14px;border-radius:999px;background:var(--cream);font-weight:600;font-size:13px}

/* notes */
.note{background:#fff;border-radius:var(--r-sm);padding:14px 16px;box-shadow:0 6px 16px -12px rgba(107,81,67,.3)}
.note + .note{margin-top:8px}
.note .t{font-weight:600}.note p{font-size:14px;margin-top:4px;color:#7A6052}.note .tag{margin-top:8px}

/* EA */
.ea{display:flex;flex-direction:column;min-height:calc(100dvh - var(--nav-h) - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px))}
.ea-head{display:flex;align-items:center;gap:12px;padding:4px 0 14px}
.ea-head .star{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--yellow),var(--blue));display:grid;place-items:center;font-size:18px;color:var(--brown)}
.ea-head p{font-size:13px;color:var(--muted)}
.msgs{flex:1;display:flex;flex-direction:column;gap:10px;padding-bottom:20px}
.msg{max-width:88%;padding:12px 16px;border-radius:20px;font-size:15px;line-height:1.5;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--brown);color:#fff;border-bottom-right-radius:8px}
.msg.ea-m{align-self:flex-start;background:#fff;box-shadow:var(--shadow);border-bottom-left-radius:8px;border:1px solid rgba(255,255,255,.7)}
.msg.ea-m .lb{font-size:11px;color:var(--muted);text-transform:none;margin-bottom:4px;letter-spacing:0}
.msg .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.msg .acts button{height:32px;padding:0 12px;border-radius:999px;background:var(--cream);font-size:13px;font-weight:500;color:var(--brown)}
.msg .acts button.done{opacity:.5;text-decoration:line-through}
.msg .mini{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--cream);font-size:14px}
.msg .mini + .mini{margin-top:6px}
.msg .mini b{font-weight:600}
.msg .mini span{display:block;font-size:12px;color:var(--muted)}
.prompts{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 10px}
.prompts::-webkit-scrollbar{display:none}
.prompts button{flex:0 0 auto;height:38px;padding:0 15px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:500}
.ea-input{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px;padding:8px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:999px;border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow)}
.ea-input input{flex:1;height:44px;border:0;background:transparent;padding:0 12px;font-size:15px}
.ea-input input::placeholder{color:var(--muted)}
.ea-input button{width:44px;height:44px;border-radius:50%;background:var(--brown);color:#fff;font-size:17px;flex:0 0 44px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;pointer-events:none}
nav.tabs .in{max-width:470px;margin:0 auto;pointer-events:auto;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 10px)}

nav.tabs button{width:100%;height:100%;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);transition:background .15s,color .15s}
nav.tabs button .i{font-size:20px;line-height:1}
nav.tabs button.on{background:var(--yellow);color:var(--brown)}

nav.tabs .badge{position:absolute;top:8px;right:14px;min-width:16px;height:16px;border-radius:999px;background:var(--brown);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}

@media(max-width:720px){.fab{right:18px}}

/* bottom sheets */
.scrim{position:fixed;inset:0;background:rgba(107,81,67,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:50;opacity:0;pointer-events:none;transition:opacity .22s}

// ---- Important dates: yearly or monthly (monthsary) ----
const pad2=n=>String(n).padStart(2,'0');
const dim=(y,m)=>new Date(y,m,0).getDate();
const isMonthly=d=>d.repeat==='monthly';
// The occurrence in a given year (and month, for monthly). Day is clamped, so the 31st lands on the 30th/28th in short months.
const occurIn=(d,y,m)=>{m=m||d.month;return `${y}-${pad2(m)}-${pad2(Math.min(d.day,dim(y,m)))}`};
const startIso=d=>d.year?occurIn(d,d.year,d.month):'';
const shiftMonth=(y,m,k)=>{const t=y*12+(m-1)+k;return [Math.floor(t/12),t%12+1]};
function nextOccur(d){const n=new Date(),y=n.getFullYear(),m=n.getMonth()+1;let iso;
  if(isMonthly(d)){iso=occurIn(d,y,m);if(iso<today()){const[y2,m2]=shiftMonth(y,m,1);iso=occurIn(d,y2,m2)}}
  else{iso=occurIn(d,y);if(iso<today())iso=occurIn(d,y+1)}
  const st=startIso(d);return st&&st>iso?st:iso}
function lastOccur(d){const n=new Date(),y=n.getFullYear(),m=n.getMonth()+1;let iso;
  if(isMonthly(d)){iso=occurIn(d,y,m);if(iso>today()){const[y2,m2]=shiftMonth(y,m,-1);iso=occurIn(d,y2,m2)}}
  else{iso=occurIn(d,y);if(iso>today())iso=occurIn(d,y-1)}
  const st=startIso(d);return st&&iso<st?'':iso}
const monthsAt=(d,iso)=>(Number(iso.slice(0,4))-d.year)*12+(Number(iso.slice(5,7))-d.month);
// A monthly date whose occurrence isn't a full year is a "monthsary"; every 12th month it's the anniversary itself.
const isMonthsary=(d,iso)=>isMonthly(d)&&(d.year?monthsAt(d,iso)%12!==0:Number(iso.slice(5,7))!==d.month);
const kindLabel=(d,iso)=>isMonthsary(d,iso)?'monthsary':d.type;
// "turns 34" / "7 years" / "month 87" for a given occurrence (defaults to the next one). Nothing on the very first date.
function dateAge(d,iso){if(!d.year)return'';iso=iso||nextOccur(d);if(!iso)return'';
  if(isMonthly(d)){const n=monthsAt(d,iso);if(n<=0)return'';if(n%12===0)return n===12?'1 year':`${n/12} years`;return `month ${n}`}
  const n=Number(iso.slice(0,4))-d.year;if(n<=0)return'';return d.type==='birthday'?`turns ${n}`:n===1?'1 year':`${n} years`}
const dateTitle=(d,iso)=>{const k=kindLabel(d,iso),a=dateAge(d,iso);return `${DTYPES[d.type]||'♡'} ${d.name}${k==='other'?'':' — '+k}${a?' ('+a+')':''}`};
const dateEventsOn=iso=>{const y=Number(iso.slice(0,4)),m=Number(iso.slice(5,7));return S.dates.filter(d=>{const st=startIso(d);if(st&&iso<st)return false;return isMonthly(d)?occurIn(d,y,m)===iso:occurIn(d,y)===iso}).map(d=>({id:'d_'+d.id,title:dateTitle(d,iso),date:iso,time:'',loc:'',allDay:true,src:'date',ref:d.id}))};
const syncedEvents=()=>SYNC.events.filter(e=>S.calSources[e.src]!==false);
const allEvents=()=>[...S.events,...syncedEvents()];
const eventsOn=d=>[...allEvents().filter(e=>e.date===d),...dateEventsOn(d)].sort((a,b)=>(a.time||'').localeCompare(b.time||''));
const todayEvents=()=>eventsOn(today()).filter(e=>e.src!=='date');
const remainingEvents=()=>todayEvents().filter(e=>e.src!=='date'&&(!e.time||e.time>=nowHM()));
const upcomingDates=(n=7)=>S.dates.map(d=>({d,iso:nextOccur(d)})).filter(x=>daysUntil(x.iso)<=(isMonthsary(x.d,x.iso)?Math.min(n,2):n)).sort((a,b)=>a.iso.localeCompare(b.iso));
const remindersToday=()=>S.reminders.filter(r=>!r.done&&r.date===today());
const upcomingTrip=()=>S.trips.filter(t=>t.status==='upcoming'&&t.start&&daysUntil(t.start)>=0).sort((a,b)=>a.start.localeCompare(b.start))[0];
const monthExpenses=()=>{const m=today().slice(0,7);return S.expenses.filter(e=>e.date.startsWith(m))};
const monthSpend=()=>monthExpenses().reduce((s,e)=>s+Number(e.amt),0);

function guessCat(t){t=t.toLowerCase();if(/austin|vet|groom|pet/.test(t))return'Austin';if(/pay|bill|card|bank|budget/.test(t))return'Finance';if(/trip|flight|hotel|passport|visa|travel/.test(t))return'Travel';if(/buy|order|shop/.test(t))return'Shopping';if(/clean|fix|repair|aircon|home|house/.test(t))return'Home';return'Personal'}

function daySummary(){
  const tod=timeOfDay(), due=dueToday().length, od=overdue().length, evs=todayEvents(), rem=remainingEvents(), doneToday=S.tasks.filter(t=>t.done&&t.due===today()).length, rems=remindersToday().length;
  const next=rem[0];
  const nextStr=next?`${next.title} at ${fmtTime(next.time)}`:'';
  const r=arr=>arr[Math.floor(Date.now()/36e5)%arr.length];
  let h,b;
  if(tod==='evening'){
    const left=due+od;
    if(left===0&&rem.length===0){h=r(["That's the day.","You're all clear for tonight.","Nothing left on the list."]);b=doneToday?`You got ${doneToday} thing${doneToday>1?'s':''} done today. Nothing is waiting on you.`:'Nothing scheduled for the rest of the evening.';}
    else{h=r(["You're nearly done for the day.","Winding down.","Almost there."]);b=`${left===1?'One small task':left+' things'} still open${rem.length?`, and ${nextStr} later`:''}. ${doneToday?`You've already closed ${doneToday} today. `:''}Anything unfinished can roll over to tomorrow.`;}
  }else if(tod==='afternoon'){
    const left=due+od;
    if(left===0&&rem.length===0){h=r(['Your afternoon is clear.','Nothing urgent this afternoon.','An easy afternoon.']);b='Nothing scheduled and nothing waiting on you.';}
    else if(left<=1&&rem.length<=1){h=r(['Your afternoon is mostly clear.','A light afternoon.']);b=`${left?`One thing to take care of${rem.length?' before '+next.title.toLowerCase():''}`:`Just ${nextStr}`}${left&&rem.length?`, then ${nextStr}`:''}.`;}
    else{h=r(["A few things left for the afternoon.","Still a bit to get through."]);b=`${left} thing${left>1?'s':''} to handle${od?` (${od} overdue)`:''}${rem.length?`, and ${rem.length} on your calendar${next?`, next up ${nextStr}`:''}`:''}.`;}
  }else{
    const total=due+od;
    if(total===0&&evs.length===0){h=r(['Nothing urgent today.','A clear day ahead.','Looks like an open day.']);b="Your calendar is clear and you don't have any overdue tasks.";}
    else if(total<=1&&evs.length<=1){h=r(['Looks like a pretty easy one today.','A quiet day ahead.','Easy day.']);b=`${evs.length?`Your ${evs[0].time<'12:00'?'morning':'afternoon'} has ${evs[0].title.toLowerCase()} at ${fmtTime(evs[0].time)}`:'Your calendar is clear'}${total?` and one thing due today`:' and nothing urgent waiting on you'}.`;}
    else if(total+evs.length<=4){h=r(["You've got a few things on your plate today.","A moderate day."]);b=`${total} thing${total>1?'s':''} due${od?` (${od} overdue)`:''}${evs.length?`, with ${evs.length===1?'one appointment':evs.length+' events'}${next?' — first up '+nextStr:''}`:''}.`;}
    else{h=r(['A full day ahead.','Busy one today.']);b=`${total} things to get through and ${evs.length} events on your calendar${next?`, starting with ${nextStr}`:''}.`;}
  }
  if(rems)b+=` ${rems===1?'One reminder':rems+' reminders'} for today too.`;
  return {h,b};
}
function worthKnowing(){
  const out=[];
  overdue().forEach(t=>out.push({lvl:'urgent',t:`${t.title} — overdue by ${-daysUntil(t.due)} day${-daysUntil(t.due)>1?'s':''}`}));
  (FIN?S.payments:[]).filter(p=>daysUntil(p.date)>=0&&daysUntil(p.date)<=3).forEach(p=>out.push({lvl:daysUntil(p.date)<=1?'urgent':'important',t:`${p.title} ${PESO(p.amt)} due ${relDay(p.date)}`}));
  S.pet.vet.filter(v=>daysUntil(v.date)>=0&&daysUntil(v.date)<=7).forEach(v=>out.push({lvl:'important',t:`${S.pet.name}'s ${v.t.toLowerCase()} ${daysUntil(v.date)===0?'is today':'in '+daysUntil(v.date)+' days'}`}));
  S.pet.meds.filter(m=>daysUntil(m.next)>=0&&daysUntil(m.next)<=3).forEach(m=>out.push({lvl:'important',t:`${S.pet.name}'s ${m.t.toLowerCase()} is due ${relDay(m.next)}`}));
  const tr=upcomingTrip();if(tr&&daysUntil(tr.start)<=21)out.push({lvl:'upcoming',t:`${tr.dest} trip in ${daysUntil(tr.start)} days${tr.packing.length?'':' — no packing list yet'}`});
  S.reminders.filter(r=>!r.done&&daysUntil(r.date)>=0&&daysUntil(r.date)<=2).forEach(r=>out.push({lvl:daysUntil(r.date)===0?'important':'upcoming',t:`${r.title} — ${relDay(r.date)}`}));
  upcomingDates(7).forEach(({d,iso})=>out.push({lvl:daysUntil(iso)<=1?'important':'upcoming',t:`${d.name}'s ${kindLabel(d,iso)==='other'?'date':kindLabel(d,iso)} ${daysUntil(iso)===0?'is today':daysUntil(iso)===1?'is tomorrow':'in '+daysUntil(iso)+' days'}${dateAge(d,iso)?' · '+dateAge(d,iso):''}`}));
  S.tasks.filter(t=>!t.done&&t.postponed>=2).forEach(t=>out.push({lvl:'upcoming',t:`You've postponed “${t.title}” ${t.postponed} times`}));
  return out.slice(0,6);
}

const parseDate=s=>{s=s.toLowerCase();if(/\btoday\b/.test(s))return today();if(/\btomorrow\b/.test(s))return addDays(today(),1);
  const dow=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];for(let i=0;i<7;i++)if(s.includes(dow[i])){const d=new Date();let diff=(i-d.getDay()+7)%7||7;return addDays(today(),diff)}
  const m=s.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s*(\d{1,2})?/);if(m){const mi=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(m[1]);let y=new Date().getFullYear();if(mi<new Date().getMonth())y++;const day=m[2]?Number(m[2]):1;return `${y}-${String(mi+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`}
  if(/next month/.test(s)){const d=new Date();d.setMonth(d.getMonth()+1,1);return isoLocal(d)}if(/next week/.test(s))return addDays(today(),7);const n=s.match(/in (\d+) days?/);if(n)return addDays(today(),Number(n[1]));return null};
const parseTime=s=>{const m=s.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);if(!m)return'';let h=Number(m[1]);if(m[3].toLowerCase()==='pm'&&h<12)h+=12;if(m[3].toLowerCase()==='am'&&h===12)h=0;return `${String(h).padStart(2,'0')}:${m[2]||'00'}`};
const parsePeso=s=>{const m=s.replace(/,/g,'').match(/(?:₱|php|around|about)?\s*(\d{3,7})\b/i);return m?Number(m[1]):0};

function answer(q){

  const od=overdue(),dt=dueToday(),evs=remainingEvents(),tr=upcomingTrip();
  if(/^(add|save)\b.*\b(birthday|anniversary|monthsary|gotcha)/.test(l)){const monthly=/monthsar/.test(l);const type=/anniversar|monthsar/.test(l)?'anniversary':/gotcha/.test(l)?'gotcha day':'birthday';const d=parseDate(l);let name=q.replace(/^(add|save)\s+/i,'').replace(/['’]s\s+(birthday|anniversary|monthsary|gotcha day).*$/i,'').replace(/\s+(birthday|anniversary|monthsary|gotcha day).*$/i,'').trim();let nm0=name.replace(/^(our|my)\s*/i,'');if(!nm0)nm0='Us';const name2=nm0;
    if(!d)return {text:`What date is ${name2}'s ${type}? Say it like “add ${name2}'s ${type} March 14”.`,label:'Assumption'};const[,m,dd]=d.split('-').map(Number);

  if(/birthday|anniversar|monthsar|important date|dates/.test(l)){const u=upcomingDates(/month/.test(l)?31:60);if(!u.length)return {text:'No important dates in the next two months.',label:'Stored'};return {text:`Coming up:`,label:'Stored',cards:u.map(({d,iso})=>({t:`${d.name} — ${kindLabel(d,iso)}`,s:`${fmtDate(iso,{month:'long',day:'numeric'})} · ${relDay(iso)}${dateAge(d,iso)?' · '+dateAge(d,iso):''}${d.notes?' · '+d.notes:''}`}))};}
  // ---- create / add intents

    const name=q.replace(/^(add|put|create|make)\s+/i,'').replace(/\s*(to|on|in)\s+(my\s+)?wish\s*list.*$/i,'').replace(/\s*(around|about|for)\s*₱?\d[\d,]*.*$/i,'').trim();const cost=parsePeso(q);
    return {text:`Want me to add “${name}” to your wishlist${cost?` at around ${PESO(cost)}`:''}?`,label:'Action',actions:[{label:'Add it',kind:'addWish',payload:{name,cost}}]};}

    const name=q.replace(/^(add|buy|get|order)\s+/i,'').replace(/\s*(to|on)\s+(my\s+)?(shopping|need to buy|grocery).*$/i,'').trim();
    return {text:`Add “${name}” to your need-to-buy list?`,label:'Action',actions:[{label:'Add it',kind:'addShop',payload:{name,status:'need'}}]};}

    const m=q.match(/trip (?:to|for)?\s*([A-Z][\w\s]+?)(?:\s+(?:in|for|on)\s+|$)/i);const dest=m?m[1].trim():q.replace(/^(create|add|plan|make)\s+(a\s+)?/i,'').replace(/\s*trip.*/i,'').trim();const d=parseDate(l);
    return {text:`I'll create a ${d?'':'potential '}trip to ${dest}${d?` starting ${fmtShort(d)} — you can set exact dates after`:' with open dates'}.`,label:'Action',actions:[{label:'Create trip',kind:'addTrip',payload:{dest,start:d||''}}]};}
  if(/^remind me\b/.test(l)){
    const d=parseDate(l)||addDays(today(),1);const title=q.replace(/^remind me (to|about|that)?\s*/i,'').replace(/\s*(next month|next week|tomorrow|today|on \w+|in \d+ days?).*$/i,'').trim();
    return {text:`Reminder: “${title}” on ${fmtDate(d,{weekday:'long',month:'short',day:'numeric'})}. Set it?`,label:'Action',actions:[{label:'Set reminder',kind:'addReminder',payload:{title,date:d}}]};}
  if(/^(add|create|new|schedule)\b.*\b(event|appointment|meeting|dinner|lunch)\b/.test(l)||(/\bat \d{1,2}(:\d{2})?\s*(am|pm)\b/.test(l)&&/^(add|schedule|put)/.test(l))){
    const d=parseDate(l)||today();const time=parseTime(l);const title=q.replace(/^(add|create|new|schedule|put)\s+(an?\s+)?(event\s*)?/i,'').replace(/\s*(on|for|at|tomorrow|today|next).*$/i,'').trim()||'Event';
    return {text:`Event: ${title}, ${fmtShort(d)}${time?' at '+fmtTime(time):''}. Add it to your calendar?`,label:'Action',actions:[{label:'Add event',kind:'addEvent',payload:{title,date:d,time}}]};}
  if(/^(add|create|new)\b.*\btask\b/.test(l)||/^(add|i need to|need to|todo|to do)\b/.test(l)){
    const d=parseDate(l);const title=q.replace(/^(add|create|new)\s+(a\s+)?(task\s*)?(to\s+)?/i,'').replace(/^(i need to|need to|todo|to do)\s+/i,'').replace(/\s*(by|on|for|due)\s+(tomorrow|today|next \w+|\w+day|in \d+ days?).*$/i,'').replace(/\s*(tomorrow|today)$/i,'').trim();

  if(/inbox|organi[sz]e|sort/.test(l)){
    if(!S.inbox.length)return {text:'Your inbox is clear. Nothing to sort.',label:'Stored'};
    const sug=S.inbox.map(i=>{const t=i.text.toLowerCase();let kind='task';if(/^(maybe|trip)|\b(in\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\w*)\b/.test(t)&&!/buy|book/.test(t))kind='trip';else if(/^(buy|get|order)\b|new\s+\w+$/.test(t))kind='shop';else if(/^(save|remember)\b|place|cafe|restaurant|ramen/.test(t))kind='note';return {i,kind}});
    return {text:`${S.inbox.length} unsorted items. Here's how I'd file them — tap to confirm each one:`,label:'Suggestion',cards:sug.map(s=>({t:s.i.text,s:'→ '+{task:'Task',shop:'Shopping',note:'Note',trip:'Trip (potential)'}[s.kind]})),actions:sug.map(s=>({label:`${s.i.text.slice(0,22)}${s.i.text.length>22?'…':''} → ${s.kind}`,kind:'sortInbox',payload:{id:s.i.id,kind:s.kind}}))};}
  // ---- spending
  if(FIN&&/spen[dt]|expense|money|budget/.test(l)&&!/bill|payment|due/.test(l)){
    const by={};monthExpenses().forEach(e=>by[e.cat]=(by[e.cat]||0)+Number(e.amt));const top=Object.entries(by).sort((a,b)=>b[1]-a[1]);
    if(!top.length)return {text:'No expenses logged this month yet.',label:'Stored'};
    return {text:`You've spent ${PESO(monthSpend())} this month. Most of it went to ${top[0][0]} (${PESO(top[0][1])})${top[1]?`, then ${top[1][0]} (${PESO(top[1][1])})`:''}.${S.finance.income?` That's ${Math.round(monthSpend()/S.finance.income*100)}% of your income.`:''}`,label:'Stored',actions:[{label:'Open finance',kind:'go',payload:{tab:'life',life:'finance'}}]};}
  if(FIN&&/bill|payment|due|card/.test(l)&&/what|which|when|coming|next|upcoming|do i/.test(l)){
    const ps=S.payments.filter(p=>daysUntil(p.date)>=0).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
    if(!ps.length)return {text:'No upcoming payments stored.',label:'Stored'};
    return {text:`Coming up: ${ps.map(p=>`${p.title} ${PESO(p.amt)} ${relDay(p.date)}`).join(', ')}. Total ${PESO(ps.reduce((s,p)=>s+p.amt,0))}.`,label:'Stored'};}
  // ---- urgent / priorities
  if(/urgent|priorit|first|start with|most important/.test(l)){
    const items=[];od.forEach(t=>items.push({t:t.title,s:`Overdue by ${-daysUntil(t.due)} day${-daysUntil(t.due)>1?'s':''}`,id:t.id}));(FIN?S.payments:[]).filter(p=>daysUntil(p.date)>=0&&daysUntil(p.date)<=1).forEach(p=>items.push({t:p.title,s:`${PESO(p.amt)} due ${relDay(p.date)}`}));dt.filter(t=>t.pr==='high').forEach(t=>items.push({t:t.title,s:'High priority, due today',id:t.id}));
    if(!items.length)return {text:'Nothing is on fire. Everything due is either today-and-light or further out.',label:'Stored'};
    return {text:`I'd start here:`,label:'Suggestion',cards:items,actions:items.filter(i=>i.id).map(i=>({label:`Done: ${i.t.slice(0,20)}`,kind:'doneTask',payload:i.id}))};}
  // ---- forgetting / putting off / waiting on
  if(/forget|forgetting|putting off|postpon|waiting on|neglect/.test(l)){
    const items=[];S.tasks.filter(t=>!t.done&&(t.postponed||0)>=2).forEach(t=>items.push({t:t.title,s:`Postponed ${t.postponed} times`,id:t.id}));od.forEach(t=>items.push({t:t.title,s:'Overdue',id:t.id}));if(tr&&!tr.packing.length)items.push({t:`${tr.dest} packing list`,s:`Trip is in ${daysUntil(tr.start)} days and there's no list yet`,pack:tr.id});if(S.inbox.length)items.push({t:'Inbox',s:`${S.inbox.length} unsorted item${S.inbox.length>1?'s':''}`});if(groomDue())items.push({t:`${S.pet.name}'s grooming`,s:'Overdue by the usual schedule'});S.pet.supplies.filter(s=>/low/i.test(s)).forEach(s=>items.push({t:s,s:`${S.pet.name} supply`}));
    if(!items.length)return {text:"Nothing stands out. No overdue tasks, no repeated postponements, inbox is clear.",label:'Stored'};
    return {text:'A few things that might be slipping:',label:'Stored',cards:items,actions:[...items.filter(i=>i.id).map(i=>({label:`Done: ${i.t.slice(0,18)}`,kind:'doneTask',payload:i.id})),...items.filter(i=>i.pack).map(i=>({label:'Start packing list',kind:'addPacking',payload:i.pack})),...(S.inbox.length?[{label:'Sort inbox',kind:'openInbox',payload:null}]:[])]};}
  // ---- plan day / today
  if(/plan my (day|saturday|sunday|monday|tuesday|wednesday|thursday|friday)|today|my day|do today/.test(l)){
    const dayM=l.match(/plan my (saturday|sunday|monday|tuesday|wednesday|thursday|friday)/);const d=dayM?parseDate(dayM[1]):today();const isToday=d===today();
    const tasks=isToday?[...od,...dt]:openTasks().filter(t=>t.due===d);const ev=isToday?evs:eventsOn(d);const rems=S.reminders.filter(r=>!r.done&&r.date===d);
    if(!tasks.length&&!ev.length&&!rems.length)return {text:isToday?"Nothing stored for today. Calendar's clear, nothing due. A free day — want me to pencil something in?":`${fmtDate(d,{weekday:'long'})} is wide open. Nothing scheduled, nothing due.`,label:'Stored'};
    const cards=[...ev.map(e=>({t:e.title,s:`${fmtTime(e.time)||'All day'}${e.src&&SRC[e.src]?' · '+SRC[e.src].n:''}${e.loc?' · '+e.loc:''}`})),...tasks.map(t=>({t:t.title,s:t.due<today()?'Overdue':`${t.cat} · ${t.pr} priority`,id:t.id})),...rems.map(r=>({t:r.title,s:'Reminder'}))];
    const lead=tasks.find(t=>t.pr==='high')||od[0]||tasks[0];
    return {text:`${isToday?'Today':fmtDate(d,{weekday:'long'})}: ${tasks.length?`${tasks.length} task${tasks.length>1?'s':''}`:'no tasks'}${ev.length?`, ${ev.length} event${ev.length>1?'s':''}`:''}${rems.length?`, ${rems.length} reminder${rems.length>1?'s':''}`:''}.${lead?` I'd knock out “${lead.title}” first${lead.due<today()?' since it\'s overdue':''}.`:''}${ev[0]&&isToday?` Then you're free until ${ev[0].title.toLowerCase()} at ${fmtTime(ev[0].time)}.`:''}`,label:'Stored + suggestion',cards,actions:tasks.slice(0,3).map(t=>({label:`Done: ${t.title.slice(0,18)}`,kind:'doneTask',payload:t.id}))};}
  // ---- week / coming up
  if(/week|coming up|upcoming|ahead|next few days|summar/.test(l)){
    const end=addDays(today(),7);const ev=[...S.events,...syncedEvents()].filter(e=>e.date>=today()&&e.date<=end).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const tk=openTasks().filter(t=>t.due&&t.due>=today()&&t.due<=end).sort((a,b)=>a.due.localeCompare(b.due));const pay=(FIN?S.payments:[]).filter(p=>daysUntil(p.date)>=0&&daysUntil(p.date)<=7);const ud=upcomingDates(7);
    const cards=[...ev.map(e=>({t:e.title,s:`${relDay(e.date)} · ${fmtTime(e.time)||'All day'}${e.src&&SRC[e.src]?' · '+SRC[e.src].n:''}`})),...ud.map(({d,iso})=>({t:`${DTYPES[d.type]} ${d.name} — ${d.type}`,s:relDay(iso)})),...tk.map(t=>({t:t.title,s:`Task · ${relDay(t.due)}`})),...pay.map(p=>({t:p.title,s:`${PESO(p.amt)} · ${relDay(p.date)}`}))];
    if(!cards.length)return {text:'The next seven days are empty in here. Nothing scheduled, nothing due.',label:'Stored'};
    return {text:`This week: ${ev.length} event${ev.length===1?'':'s'}, ${tk.length} task${tk.length===1?'':'s'} due${pay.length?`, ${pay.length} payment${pay.length>1?'s':''} (${PESO(pay.reduce((s,p)=>s+p.amt,0))})`:''}${tr&&daysUntil(tr.start)<=7?`, and ${tr.dest} starts ${relDay(tr.start)}`:''}.${od.length?` Plus ${od.length} overdue from before.`:''}`,label:'Stored',cards};}
  // ---- austin
  if(/austin|pet|dog|vet|groom/.test(l)){const p=S.pet;const v=p.vet.filter(x=>daysUntil(x.date)>=0)[0];const med=p.meds[0];
    return {text:`${p.name}: ${v?`${v.t.toLowerCase()} ${relDay(v.date)}`:'no vet visit scheduled'}. Grooming ${groomDue()?'is due':p.grooming.last?`was ${-daysUntil(p.grooming.last)} days ago`:'not tracked'}.${med?` ${med.t} next ${relDay(med.next)}.`:''}${p.food.remaining?` Food: ${p.food.remaining} left.`:''}${p.supplies.length?` Supplies: ${p.supplies.join(', ')}.`:''}`,label:'Stored',actions:[{label:`Open ${p.name}`,kind:'go',payload:{tab:'life',life:'austin'}}]};}
  // ---- trips
  if(/trip|travel|taiwan|flight|hotel|pack/.test(l)){
    if(!S.trips.length)return {text:'No trips stored yet. Somewhere on your mind? Say “create a trip to …”.',label:'Stored'};
    const t=tr||S.trips[0];const packed=t.packing.filter(p=>p.d).length;
    return {text:`${t.dest}${t.start?` is in ${daysUntil(t.start)} days (${fmtShort(t.start)}–${fmtShort(t.end)})`:' has no dates yet'}. ${t.flight.out?'Flight booked':'No flight yet'}, ${t.hotel?'hotel booked':'no hotel yet'}. Packing: ${t.packing.length?`${packed}/${t.packing.length} done`:'no list yet'}.${t.notes?` Note: ${t.notes}`:''}`,label:'Stored',actions:[{label:'Open trip',kind:'go',payload:{tab:'life',life:'trip:'+t.id}},...(t.packing.length?[]:[{label:'Start packing list',kind:'addPacking',payload:t.id}])]};}
  // ---- overdue
  if(/overdue|late|missed/.test(l)){if(!od.length)return {text:'Nothing overdue. Clean slate.',label:'Stored'};return {text:`${od.length} overdue:`,label:'Stored',cards:od.map(t=>({t:t.title,s:`Due ${relDay(t.due)}`,id:t.id})),actions:od.flatMap(t=>[{label:`Done: ${t.title.slice(0,16)}`,kind:'doneTask',payload:t.id},{label:`Move to tomorrow`,kind:'rollTask',payload:t.id}])};}
  // ---- wishlist / shopping queries
  if(/wishlist|wish list|want/.test(l))return {text:S.wishlist.length?`On your wishlist: ${S.wishlist.map(w=>w.name).join(', ')}.`:'Wishlist is empty.',label:'Stored'};
  if(/shopping|buy|need to get/.test(l)){const n=S.shopping.filter(s=>s.status==='need');return {text:n.length?`Need to buy: ${n.map(s=>s.name).join(', ')}.`:'Nothing on the need-to-buy list.',label:'Stored'};}
  if(/note|remember|cafe|restaurant/.test(l)){const ns=S.notes.filter(n=>l.split(' ').some(w=>w.length>3&&(n.title+n.body+n.cat).toLowerCase().includes(w)));return {text:ns.length?`Found ${ns.length} note${ns.length>1?'s':''}:`:'No matching notes. Want me to save one?',label:'Stored',cards:ns.map(n=>({t:n.title,s:n.body}))};}
  if(/home|house|repair|fix/.test(l)){const h=S.home.filter(x=>x.status!=='done');return {text:h.length?`Home list: ${h.map(x=>x.title).join('; ')}.`:'Nothing open on the home list.',label:'Stored'};}
  if(/^(hi|hello|hey|thanks|thank you)/.test(l))return {text:/thank/.test(l)?'Anytime.':`Hi. ${daySummary().h} ${daySummary().b}`,label:''};
  return {text:"I didn't catch that. I can tell you about today, this week, what's urgent, important dates, Austin, trips, your inbox — or add tasks, reminders, events, wishes and trips if you phrase it like “Add … to my wishlist” or “Remind me to … next week”.",label:'Assumption'};
}

/* ===================== SWIPE ROWS ===================== */
// Swipe left on any [data-del] row to reveal Delete. Rows with a _onRight handler (tasks) also swipe right to complete.
const DEL_W=84;let openRow=null;
function closeRow(w){if(!w)return;w._set(0,true);if(openRow===w)openRow=null}
function delItem(spec){const[coll,id]=spec.split(':');if(!Array.isArray(S[coll]))return;S[coll]=S[coll].filter(x=>x.id!==id);save();toast('Deleted');render()}
function wrapSwipe(row){
  if(row.parentNode&&row.parentNode.classList&&row.parentNode.classList.contains('sw'))return;
  const w=document.createElement('div');w.className='sw '+(row.classList.contains('li')?'inline':'stack');
  const del=document.createElement('button');del.className='sw-del';del.type='button';del.textContent='Delete';del.setAttribute('aria-label','Delete');
  const right=document.createElement('div');right.className='sw-right';right.textContent=row.dataset.right||'';
  row.parentNode.insertBefore(w,row);w.append(right,del,row);row.classList.add('sw-row');
  let x0=0,y0=0,off=0,base=0,mode=null,moved=false,pid=null;
  w._set=(v,anim)=>{off=v;row.style.transition=anim?'transform .2s ease':'none';del.style.transition=right.style.transition=anim?'width .2s ease':'none';
    row.style.transform=v?`translateX(${v}px)`:'';del.style.width=Math.max(0,-v)+'px';right.style.width=Math.max(0,v)+'px'};
  row.addEventListener('pointerdown',e=>{if(e.button)return;if(openRow&&openRow!==w)closeRow(openRow);x0=e.clientX;y0=e.clientY;base=off;mode=null;moved=false;pid=e.pointerId});
  row.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;const dx=e.clientX-x0,dy=e.clientY-y0;
    if(!mode){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){mode='h';moved=true;try{row.setPointerCapture(pid)}catch(_){}}else if(Math.abs(dy)>8){mode='v';return}else return}
    if(mode!=='h')return;let v=base+dx;const maxR=row._onRight?110:0;v=Math.max(-DEL_W-24,Math.min(maxR,v));w._set(v)});
  const end=e=>{if(e.pointerId!==pid)return;pid=null;if(mode!=='h'){mode=null;return}mode=null;
    if(off<-DEL_W/2){w._set(-DEL_W,true);openRow=w}else if(row._onRight&&off>80){w._set(0,true);row._onRight()}else closeRow(w)};
  row.addEventListener('pointerup',end);row.addEventListener('pointercancel',end);
  // swallow the click that ends a swipe, and taps on an open row just close it
  w.addEventListener('click',e=>{if(e.target.closest('.sw-del'))return;if(moved){e.stopPropagation();e.preventDefault();moved=false;return}if(off){e.stopPropagation();e.preventDefault();closeRow(w)}},true);
  del.addEventListener('click',e=>{e.stopPropagation();openRow=null;delItem(row.dataset.del)});
}
new MutationObserver(()=>$$('[data-del]').forEach(r=>{if(!r.closest('.sw'))wrapSwipe(r)})).observe(document.getElementById('app'),{childList:true,subtree:true});
document.addEventListener('pointerdown',e=>{if(openRow&&!openRow.contains(e.target))closeRow(openRow)},true);

/* ===================== RENDER ===================== */
function render(){
  const b=$('#inboxBadge');b.hidden=!S.inbox.length;b.textContent=S.inbox.length;
  ({home:renderHome,tasks:renderTasks,cal:renderCal,life:renderLife,ea:renderEA})[tab]();
}
render();loadRemote().then(()=>loadCalendar(false));
if(REMOTE&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(()=>{if(REMOTE&&document.visibilityState==='visible')loadCalendar(false)},10*60*1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&REMOTE&&Date.now()-SYNC.at>5*60*1000)loadCalendar(false)});
</script>
